{% extends 'base.html' %}

{% block title %}Register - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7">
        <div class="form-card shadow-lg p-4">
            <div class="text-center mb-4">
                <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Create an Account</h3>
                <p class="text-muted">Register as a Member to access library resources</p>
            </div>

            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label fw-semibold">Full Name *</label>
                        <input type="text" name="name" id="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label for="username" class="form-label fw-semibold">Username *</label>
                        <input type="text" name="username" id="username" class="form-control" placeholder="johndoe" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email Address *</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                        <input type="text" name="phone" id="phone" class="form-control" placeholder="+91 9876543210">
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">Password *</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm Password *</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-12">
                        <label for="role" class="form-label fw-semibold">Account Role</label>
                        <select name="role" id="role" class="form-select">
                            <option value="member" selected>Member / Student</option>
                            <option value="admin">Admin / Librarian</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-4 fs-6">
                    <i class="fas fa-check-circle me-2"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">Already registered? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Log In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
