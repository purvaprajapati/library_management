{% extends 'base.html' %}

{% block title %}Forgot Password - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5">
        <div class="form-card shadow-sm p-4">
            <div class="text-center mb-4">
                <div class="bg-info text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                    <i class="fas fa-unlock-alt"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Reset Password</h3>
                <p class="text-muted">Enter your account username or email to set a new password</p>
            </div>

            <form method="POST" action="{% url 'forgot_password' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="identifier" class="form-label fw-semibold">Username or Email *</label>
                    <input type="text" name="identifier" id="identifier" class="form-control" placeholder="Enter username or email" required>
                </div>

                <div class="mb-3">
                    <label for="new_password" class="form-label fw-semibold">New Password *</label>
                    <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Enter new password" required>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label fw-semibold">Confirm Password *</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-3 fs-6">
                    <i class="fas fa-redo me-2"></i> Reset Password
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">
                    <i class="fas fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
