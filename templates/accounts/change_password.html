{% extends 'base.html' %}

{% block title %}Change Password - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="form-card shadow-sm p-4">
            <div class="text-center mb-4">
                <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Change Password</h3>
                <p class="text-muted">Update your account password</p>
            </div>

            <form method="POST" action="{% url 'change_password' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="current_password" class="form-label fw-semibold">Current Password *</label>
                    <input type="password" name="current_password" id="current_password" class="form-control" required placeholder="Enter current password">
                </div>

                <div class="mb-3">
                    <label for="new_password" class="form-label fw-semibold">New Password *</label>
                    <input type="password" name="new_password" id="new_password" class="form-control" required placeholder="Enter new password">
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label fw-semibold">Confirm New Password *</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" required placeholder="Confirm new password">
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-3 fs-6">
                    <i class="fas fa-key me-2"></i> Update Password & Logout
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
