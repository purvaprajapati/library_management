{% extends 'base.html' %}

{% block title %}Issue Book - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7">
        <div class="form-card p-4">
            <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; font-size: 1.5rem;">
                    <i class="fas fa-hand-holding-book"></i>
                </div>
                <div>
                    <h3 class="fw-bold text-dark mb-0">Issue Book to Member</h3>
                    <p class="text-muted mb-0">Select an active member and an available book to create issue record.</p>
                </div>
            </div>

            <form id="issue-form" method="POST" action="{% url 'issue_book' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="member_id" class="form-label fw-semibold">Select Member *</label>
                    <select name="member_id" id="member_id" class="form-select" required>
                        <option value="">-- Choose Member --</option>
                        {% for member in members %}
                            <option value="{{ member.id }}">{{ member.user.name }} ({{ member.membership_id }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="book_id" class="form-label fw-semibold">Select Book *</label>
                    <select name="book_id" id="book_id" class="form-select" required>
                        <option value="">-- Choose Available Book --</option>
                        {% for book in books %}
                            <option value="{{ book.id }}" {% if preselected_book_id and preselected_book_id == book.id|stringformat:"s" %}selected{% endif %}>
                                {{ book.title }} by {{ book.author }} (Available: {{ book.available_copies }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Issue Date</label>
                        <input type="text" class="form-control bg-light" value="Today ({% now 'd M Y' %})" disabled>
                    </div>
                    <div class="col-md-6">
                        <label for="due_date" class="form-label fw-semibold">Due Date *</label>
                        <input type="date" name="due_date" id="due_date" class="form-control" value="{{ default_due_date }}" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'issued_books' %}" class="btn btn-secondary-custom">Cancel</a>
                    <button type="submit" id="btn-issue-book" class="btn btn-primary-custom">
                        <i class="fas fa-check-circle me-1"></i> Confirm Issue
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
